# Ships the client app "Pacific Elite Rides" from GitHub, with no terminal and no passwords (2026-11-18).
#
# By hand: GitHub → Actions → Ship → Run workflow → pick what to do.
# Without a browser (2026-11-21): change the line in the file .ota-update and push — that sends an over-the-air
# update with that line as its message. Builds and App Store submissions stay by hand only.
#   store   a new App Store build: EAS builds the iPhone app and sends it to App Store Connect (TestFlight).
#           Needed when the version in app.json changes or a native module is added.
#   submit  send the latest finished EAS build to App Store Connect (when a build was made without submitting).
#   update  an over-the-air update for the version that is already in the App Store (JavaScript and pictures only).
#
# One secret in Settings → Secrets and variables → Actions:
#   EXPO_TOKEN   expo.dev → Access tokens
# Everything else lives on expo.dev: the Apple certificate and the App Store Connect key (Credentials), and the
# app's own values (Environment variables → production): EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY,
# EXPO_PUBLIC_GOOGLE_PLACES_API_KEY, META_APP_ID, META_CLIENT_TOKEN.
name: Ship

on:
  push:
    branches: [main]
    paths: ['.ota-update']
  workflow_dispatch:
    inputs:
      what:
        description: What to do
        type: choice
        default: update
        options: [update, store, submit]
      message:
        description: Update message (shown in EAS; for "update" only)
        type: string
        default: Update from GitHub

concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: App Store build (EAS builds, then submits to App Store Connect)
        if: inputs.what == 'store'
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --no-wait --auto-submit
      - name: Send the latest build to App Store Connect
        if: inputs.what == 'submit'
        run: npx eas-cli@latest submit --platform ios --profile production --latest --non-interactive --no-wait
      - name: Over-the-air update (production channel)
        if: github.event_name == 'push' || inputs.what == 'update'
        env:
          TYPED: ${{ inputs.message }}
        run: |
          MSG="$TYPED"
          [ "${{ github.event_name }}" = "push" ] && MSG="$(head -n 1 .ota-update)"
          [ -z "$MSG" ] && MSG="Update from GitHub"
          npx eas-cli@latest update --channel production --environment production --platform ios --message "$MSG" --non-interactive
